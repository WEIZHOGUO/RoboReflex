# 机映 RoboReflex M4 场景：避障（简单档）——挡板要躲开飞来的球，不是接。
# 与接球场景同一套代码（场景即配置）：mode=dodge 翻转成功判定。
# 发球分布刻意偏向中线（窄角度+小 spawn 偏移），让"威胁"真实存在；
# 球落地/掠过即威胁解除 → 仲裁器交还慢通路的软过渡在本场景有真实触发。
name: dodge_easy
mode: dodge

launch:
  delay_range: [0.2, 0.8]     # 复位后延迟发球时间窗口（秒）
  speed_range: [2.0, 3.5]     # 初速（m/s），与接球场景一致
  angle_range: [-15, 15]      # 窄角度：球大致砸向中线区域
  spawn_height: 1.5           # 发球固定高度（米）
  spawn_x_range: [-0.15, 0.15]  # 发球点 x 小范围偏移（米）

paddle:
  max_speed: 6.0              # 挡板目标速度上限（m/s）
  x_limit: 0.95               # 拦截/撤离点裁剪范围（略小于关节限位 ±1.0）

catch_height: 0.17            # 威胁判定高度（球心过此高度即掠过挡板顶面）
fail_z: 0.03                  # 球心低于此高度判定落地（dodge 模式=躲开成功）
max_episode_time: 6.0         # 单次试验最长仿真时间（秒）
false_trigger_threshold: 0.02 # 无球期挡板位移超过此值（米）记一次误触发
action_threshold: 0.1         # "首次有效动作"判定阈值（m/s）
dodge_radius: 0.22            # 威胁半径（米）：落点距挡板 < 此值需撤离
                              # （几何依据：挡板半宽 0.15 + 球半径 0.05 + 余量 0.02）
